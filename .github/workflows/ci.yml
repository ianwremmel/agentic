name: CI

on:
  push:
    # Branch pushes only. A release pushes a tag, and re-running these jobs
    # against it is at best wasted — commitlint's `--from origin/main --to
    # HEAD` has no meaning on a tag ref. Naming `branches` is what excludes
    # tags: a `push` filter that names only one ref type does not run for the
    # other. `tags-ignore` alone would have excluded *branches* instead and
    # stopped CI entirely.
    branches: ['**']
  pull_request:
  # Escape hatch. A squash merge concatenates the branch's commit messages, so
  # a PR opened with this repo's `chore: open PR [skip ci]` commit can land on
  # main carrying that marker, and GitHub then skips the whole run — release
  # included. Re-run this workflow by hand to publish what that merge missed.
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The commit-msg hook only runs for people who ran `npm install`, so the
      # branch's commits are re-checked here.
      - run:
          npx commitlint --from origin/${{ github.event.pull_request.base.ref ||
          github.event.repository.default_branch }} --to HEAD --verbose

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the wrapper accepts, and current. Both must run the
        # unbuilt .mts sources.
        node: ['24.18', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    name: release
    # The three jobs that can say the code is broken. `commitlint` is left out
    # on purpose: it lints `origin/main..HEAD`, which is empty once the branch
    # has landed, so requiring it here would gate the release on a job with
    # nothing to check. `claude plugin validate` lives in its own workflow and
    # cannot gate a job in this one — a plugin that fails it can still publish,
    # which is the gap to close if this ever bites.
    needs: [lint, typecheck, test]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One release at a time: two concurrent runs would race to read the last
    # tag and could both resolve the same next version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Everything semantic-release does against the API — the tag, the release,
      # the comments on closed issues and PRs — runs on the app token minted
      # below rather than GITHUB_TOKEN, so GITHUB_TOKEN needs nothing but OIDC.
      #
      # Mint the OIDC token npm exchanges for publish credentials. Without it
      # there is no way to authenticate at all — nothing else here carries a
      # registry credential.
      id-token: write
    steps:
      # main's ruleset requires a pull request, and @semantic-release/git pushes
      # the version manifests straight to it. That bypass is granted to this
      # app's bot user, npm-publisher-ianwremmel[bot]: GitHub refuses to grant
      # one to a GitHub App itself on a user-owned repo ("must be part of the
      # ruleset source or owner organization"), and GITHUB_TOKEN authenticates
      # as the Actions app, which matches no actor. This token authenticates as
      # the bot user and expires in an hour.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # semantic-release reads the whole history back to the last release tag
      # to decide the next version.
      #
      # `token` is load-bearing. checkout persists whatever token it is given as
      # an auth header, and git sends that header on every push regardless of
      # the URL semantic-release builds — so leaving the default here would send
      # the manifest push out as the Actions app and get it rejected.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
