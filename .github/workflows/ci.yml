name: CI

on:
  push:
    # Branch pushes only. A release pushes a tag, and re-running these jobs
    # against it is at best wasted — commitlint's `--from origin/main --to
    # HEAD` has no meaning on a tag ref. Naming `branches` is what excludes
    # tags: a `push` filter that names only one ref type does not run for the
    # other. `tags-ignore` alone would have excluded *branches* instead and
    # stopped CI entirely.
    branches: ['**']
  pull_request:
  # Escape hatch. A squash merge concatenates the branch's commit messages, so
  # a PR opened with this repo's `chore: open PR [skip ci]` commit can land on
  # main carrying that marker, and GitHub then skips the whole run — release
  # included. Re-run this workflow by hand to publish what that merge missed.
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The commit-msg hook only runs for people who ran `npm install`, so the
      # branch's commits are re-checked here.
      - run:
          npx commitlint --from origin/${{ github.event.pull_request.base.ref ||
          github.event.repository.default_branch }} --to HEAD --verbose

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the wrapper accepts, and current. Both must run the
        # unbuilt .mts sources.
        node: ['24.18', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    name: release
    # The three jobs that can say the code is broken. `commitlint` is left out
    # on purpose: it lints `origin/main..HEAD`, which is empty once the branch
    # has landed, so requiring it here would gate the release on a job with
    # nothing to check. `claude plugin validate` lives in its own workflow and
    # cannot gate a job in this one — a plugin that fails it can still publish,
    # which is the gap to close if this ever bites.
    needs: [lint, typecheck, test]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # One release at a time: two concurrent runs would race to read the last
    # tag and could both resolve the same next version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      # Push the release tag and create the GitHub release.
      contents: write
      # @semantic-release/github comments on the issues and PRs a release
      # closes.
      issues: write
      pull-requests: write
      # Mint the OIDC token npm exchanges for publish credentials. Without it
      # there is no way to authenticate at all — nothing else here carries a
      # registry credential.
      id-token: write
    steps:
      # semantic-release reads the whole history back to the last release tag
      # to decide the next version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # @semantic-release/npm exchanges an OIDC token itself, but only to
      # confirm the context is live: it discards the result and shells out to
      # `npm publish`, which mints its own. Trusted publishing is therefore the
      # npm CLI's feature, and an npm older than 11.5.1 fails at `publish` —
      # after `prepare` has already pushed the manifest commit to main and
      # tagged it, which is the half-finished state release.config.mjs
      # describes recovering from. Check before then.
      #
      # Check the binary execa will pick, not the runner's: it runs npm with
      # preferLocal, and @semantic-release/npm depends on npm itself, so
      # node_modules/.bin/npm shadows whatever setup-node installed. That
      # dependency range keeps the local npm well above the floor, so this
      # should never fire; it exists to catch the day it stops being true.
      - name: Check npm supports trusted publishing
        run: |
          npm_bin=npm
          if [ -x node_modules/.bin/npm ]; then
            npm_bin=node_modules/.bin/npm
          fi
          have="$("$npm_bin" --version)"
          need=11.5.1
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::$npm_bin is $have, but trusted publishing needs" \
              "$need or newer. Raise the npm that @semantic-release/npm" \
              "resolves, or the Node running this job if there is no local npm."
            exit 1
          fi
          echo "publishing with $npm_bin $have"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
