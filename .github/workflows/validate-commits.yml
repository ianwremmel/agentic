name: Validate Commits

on:
  push:
    # Branch pushes only; naming `branches` is what excludes the tag a
    # release pushes, for which none of this is meaningful.
    branches: ['**']
  pull_request:

jobs:
  prevent-fixup-commits:
    name: prevent-fixup-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-fixup-commits@6a764097202c8e5a67bc40ea01125b1eacdfb236 # v2.0.0

  prevent-nopush-commits:
    name: prevent-nopush-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-nopush-commits@8bf416b9675b3b781dd7426b549f2f03f9744d46 # v1.0.8
