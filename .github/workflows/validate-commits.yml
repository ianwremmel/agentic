name: Validate Commits

on:
  push:
    # Branch pushes only; naming `branches` is what excludes the tag a
    # release pushes, for which none of this is meaningful.
    branches: ['**']
  pull_request:

jobs:
  prevent-fixup-commits:
    name: prevent-fixup-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-fixup-commits@f52dc067662b1d71b4cfbb13e2ca2d1ea71bf612 # v1.0.8

  prevent-nopush-commits:
    name: prevent-nopush-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-nopush-commits@2165bb0c34198b524e24928ead4c887ac058ea4a # v2.0.0
