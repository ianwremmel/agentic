[package]
name = "dispatch"
version = "0.1.0"
edition = "2021"
description = "CLI for the dispatch plugin: PR status protocol and (in time) daemon, MCP server, and task orchestration."
license = "MIT"
repository = "https://github.com/ianwremmel/agentic"
publish = false

[[bin]]
name = "dispatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
